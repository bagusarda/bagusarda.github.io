<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Bagus Arda</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100">

    <!-- ====================================================== -->
    <!-- HEADER -->
    <!-- ====================================================== -->

    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-5 md:p-4">

        <div class="max-w-4xl mx-auto flex items-center justify-between min-h-[4rem]">

            <a href="index.html#gallery"
               class="text-sm font-bold text-teal-400 hover:underline">
                Home
            </a>

            <h1 class="text-sm font-black tracking-wider text-teal-400">
                GALLERY
            </h1>

        </div>

    </header>

    <!-- ====================================================== -->
    <!-- MAIN -->
    <!-- ====================================================== -->

    <div class="max-w-4xl mx-auto p-5 md:p-10">

        <!-- ====================================================== -->
        <!-- HERO -->
        <!-- ====================================================== -->

        <section class="mb-12">

            <h1 class="text-5xl font-extrabold text-teal-400 mb-5">
                Galeri & Dokumentasi
            </h1>

            <p class="text-slate-300 leading-relaxed text-lg">
                Dokumentasi berbagai kegiatan akademik, pelatihan, praktik industri, serta proses pengerjaan berbagai proyek yang pernah saya kerjakan.
            </p>

        </section>

        <!-- ====================================================== -->
        <!-- BLKPP DIY -->
        <!-- ====================================================== -->

        <section class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl">

            <h2 class="text-2xl font-bold text-teal-400">
                Pelatihan di BLKPP DIY
            </h2>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

                <img src="Assets/gallery/blk1.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/blk2.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/blk3.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/blk4.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

            </div>

        </section>

        <!-- ====================================================== -->
        <!-- PRAKTIK INDUSTRI -->
        <!-- ====================================================== -->

        <section class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl mt-10">

            <h2 class="text-3xl font-extrabold text-teal-400 mb-6">
                Praktik Industri
            </h2>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

                <img src="Assets/gallery/pkl1.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/pkl2.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/pkl3.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/pkl4.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

            </div>

        </section>

        <!-- ====================================================== -->
        <!-- KOMPETISI -->
        <!-- ====================================================== -->

        <section class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl mt-10">

            <h2 class="text-3xl font-extrabold text-teal-400 mb-6">
                Praktik Kependidikan
            </h2>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

                <img src="Assets/gallery/pk1.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/pk2.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/pk3.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/pk4.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

            </div>

        </section>

        <!-- ====================================================== -->
        <!-- ORGANISASI -->
        <!-- ====================================================== -->

        <section class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl mt-10">

            <h2 class="text-3xl font-extrabold text-teal-400 mb-6">
                Pengerjaan Proyek
            </h2>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

                <img src="Assets/gallery/pro1.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/pro2.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/pro3.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

                <img src="Assets/gallery/pro4.jpg" class="aspect-[4/3] w-full object-cover rounded-lg border border-slate-700 hover:scale-105 transition duration-300">

            </div>

        </section>

    </div>

</body>
</html>
